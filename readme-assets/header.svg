<svg width="100%" height="160" viewBox="0 0 854 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Clip path that reveals the typewriter text progressively without sliding -->
    <clipPath id="typewriter-clip">
      <rect x="0" y="70" width="0" height="50">
        <animate
          attributeName="width"
          values="0; 854; 854; 0"
          keyTimes="0; 0.55; 0.85; 1"
          dur="8s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .typing-text {
      font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
      font-size: 21px;
      font-weight: 500;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <!-- Waving Background Paths -->
  <g transform="translate(427, 80) scale(1, 1) translate(-427, -80)">
    <path fill="url(#header-gradient)" opacity="0.85">
      <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 80Q 213.5 120 427 90T 854 115L 854 0 Z;M0 0L 0 105Q 213.5 120 427 100T 854 90L 854 0 Z;M0 0L 0 125Q 213.5 95 427 125T 854 90L 854 0 Z;M0 0L 0 80Q 213.5 120 427 90T 854 115L 854 0 Z"
      />
    </path>
    <path fill="url(#header-gradient)" opacity="0.5">
      <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-6s"
        values="M0 0L 0 95Q 213.5 140 427 110T 854 120L 854 0 Z;M0 0L 0 110Q 213.5 80 427 80T 854 100L 854 0 Z;M0 0L 0 105Q 213.5 85 427 110T 854 125L 854 0 Z;M0 0L 0 95Q 213.5 140 427 110T 854 120L 854 0 Z"
      />
    </path>
  </g>

  <!-- Title Text -->
  <text x="50%" y="36%" class="title">Sean Richard O. Tadiamon</text>

  <!-- Typewriter Subtitle Text (Centered & clipped to reveal cleanly without sliding) -->
  <g clip-path="url(#typewriter-clip)">
    <text x="50%" y="64%" class="typing-text">Computer Engineering Student | Full Stack Developer | System Engineer</text>
  </g>
</svg>
